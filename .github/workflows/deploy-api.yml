name: Deploy API to VPS

on:
    push:
        branches: [main]
        paths:
            # packages/** is here because the API compiles @alarm/types and
            # @alarm/core into its image. A change to the wake-time engine is a
            # change to the API, even though no file under apps/api moved.
            - 'apps/api/**'
            - 'packages/**'
            - 'docker-compose.prod.yml'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # The context is the repository root, not apps/api: the image needs
            # the root lockfile and the two shared packages.
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-alarm-api:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/dynamic-alarm-api:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # envsubst replaces every $NAME in the template with the matching
            # variable and leaves the literal lines alone. Nothing secret is
            # committed: .env.dist holds only placeholders.
            - name: Render .env from the template
              working-directory: apps/api
              env:
                  DB_HOST: ${{ secrets.DB_HOST }}
                  DB_PORT: ${{ secrets.DB_PORT }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_NAME: ${{ secrets.DB_NAME }}
                  NS_SUBSCRIPTION_KEY: ${{ secrets.NS_SUBSCRIPTION_KEY }}
                  TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
                  MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
                  # Repository variables rather than secrets: neither is one, and
                  # a variable can be flipped in the UI and redeployed, which is
                  # the whole point of the diagnostic being a flag. Unset
                  # substitutes to empty, and the API reads empty as unset, so
                  # never configuring either leaves the safe default in place.
                  TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
                  IP_DIAGNOSTIC: ${{ vars.IP_DIAGNOSTIC }}
              run: |
                  envsubst < .env.dist > .env

                  # A name that is not set substitutes to an empty string rather
                  # than failing, so the check has to happen here. Without a
                  # transport key the API starts and only fails when the first
                  # journey is planned, which is the middle of the night for
                  # whoever is relying on it.
                  missing=""
                  # MONITOR_TOKEN is required too: without it the tick route
                  # answers 503 and no alarm is ever kept current, which is a
                  # silent failure at 03:00 rather than a loud one here.
                  for name in DB_HOST DB_USER DB_NAME NS_SUBSCRIPTION_KEY TOMTOM_API_KEY MONITOR_TOKEN; do
                    grep -q "^${name}=.\+" .env || missing="${missing} ${name}"
                  done
                  if [ -n "${missing}" ]; then
                    echo "::error::Empty after rendering:${missing}. Set them as repository secrets."
                    exit 1
                  fi
                  echo "Rendered .env with $(grep -c '=' .env) values."

                  # Said loudly, because this is the one setting that is meant to
                  # be temporary and the only thing that would otherwise remember
                  # it is a person. The route hands the proxy chain and the
                  # request's headers to an unauthenticated caller.
                  if grep -q '^IP_DIAGNOSTIC=true$' .env; then
                    echo "::warning::IP_DIAGNOSTIC is on, so GET /api/v1/ip is public on this deploy. Set the repository variable back to false once TRUST_PROXY_HOPS is settled."
                  fi

            - name: Setup SSH agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

            - name: Transfer deployment files to VPS
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                    "mkdir -p /opt/apps/dynamic-alarm-api"

                  # Compose interpolates the image name from DOCKERHUB_USERNAME,
                  # so that has to sit in the same file the app reads its own
                  # configuration from.
                  printf 'DOCKERHUB_USERNAME=%s\n' '${{ secrets.DOCKERHUB_USERNAME }}' > deploy.env
                  cat deploy.env apps/api/.env > merged.env

                  rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
                    docker-compose.prod.yml \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/dynamic-alarm-api/docker-compose.yml

                  rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
                    merged.env \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/dynamic-alarm-api/.env

            - name: Deploy with Docker Compose
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/dynamic-alarm-api

                    docker compose pull
                    docker compose up -d

                    # start_period is 30s, so allow comfortably more than that
                    # before calling it a failure.
                    for i in $(seq 1 18); do
                      if docker compose ps | grep -q "dynamic-alarm-api.*healthy"; then
                        echo "Container healthy after $((i * 5))s."
                        break
                      fi
                      sleep 5
                    done

                    docker compose ps

                    if ! docker compose ps | grep -q "dynamic-alarm-api.*healthy"; then
                      echo "Container never became healthy. Last 50 lines:"
                      docker compose logs --tail=50 api
                      exit 1
                    fi
                  ENDSSH

            # Ofelia reads container labels when *it* starts, not when a
            # labelled container appears. A job it has already registered
            # survives its container being recreated, which is why the neighbour
            # app's hourly job has kept running since July. What it never picks
            # up is a job that did not exist the last time it started.
            #
            # That is this API exactly. The tick never ran once in production
            # until the evening of 2026-08-19: the labels were correct the whole
            # time, and the scheduler had last read them on 2026-07-19, a month
            # before this API first deployed. From a phone it was
            # indistinguishable from push being broken.
            #
            # Strictly this is only needed when the labels change, and a deploy
            # is the only moment they can. Doing it every time costs seconds and
            # removes the need to remember which kind of change this was. The
            # restart re-scans every labelled container on the host, so it
            # restores other apps' jobs rather than only this one.
            - name: Re-register the monitor tick with the scheduler
              run: |
                  ssh -o StrictHostKeyChecking=accept-new                     ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    docker restart scheduler
                    sleep 5

                    # Verified rather than assumed. A scheduler that came back
                    # without this job is a deploy that looks green and quietly
                    # stops moving alarms.
                    if ! docker logs scheduler 2>&1 | tail -20 | grep -q 'monitor-tick'; then
                      echo "The scheduler restarted without registering monitor-tick."
                      docker logs scheduler --tail=20
                      exit 1
                    fi
                    echo "monitor-tick registered."
                  ENDSSH

            # After the container is up, not before: the image is what carries
            # the migrations, and running them from anywhere else would mean a
            # second copy of the schema history.
            - name: Run database migrations
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/dynamic-alarm-api

                    # The container's own environment is already loaded from
                    # .env by compose, so nothing needs sourcing here. The
                    # knexfile detects that it is running compiled and looks for
                    # .js migrations rather than .ts.
                    docker compose exec -T api \
                      npx knex migrate:latest --knexfile dist/database/knexfile.js
                  ENDSSH

            - name: Verify
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/dynamic-alarm-api

                    # Reports the database separately, so a process that is up
                    # but cannot reach MySQL fails here rather than at 06:00.
                    docker compose exec -T api \
                      wget -qO- http://127.0.0.1:3000/api/v1/health
                  ENDSSH
