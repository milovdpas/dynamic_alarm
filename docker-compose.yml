services:
  mysql:
    # MySQL because the production hosting only offers MySQL. Chosen over
    # Postgres for that reason alone, and 8.0 specifically because the M2
    # monitor loop depends on SELECT ... FOR UPDATE SKIP LOCKED, which arrived
    # in 8.0. On 5.7 that design would not work.
    image: mysql:8.0
    container_name: dynamic-alarm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: alarm
      MYSQL_DATABASE: dynamic_alarm
      MYSQL_USER: alarm
      MYSQL_PASSWORD: alarm
    command:
      # utf8mb4 throughout: station names and Dutch street names contain
      # characters that latin1 silently mangles.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The server runs in UTC and every timestamp is stored in UTC. A local
      # server timezone would silently shift stored times when the clocks
      # change, which for an alarm clock is the worst possible bug.
      - --default-time-zone=+00:00
    ports:
      # Non-default host port so this cannot collide with another local MySQL.
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-ualarm', '-palarm']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
