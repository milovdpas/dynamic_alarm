# Deployed to /opt/apps/dynamic-alarm-api/docker-compose.yml on the VPS.
#
# There is no database service here. Nothing on that VPS runs one: both existing
# APIs use an external MySQL reached through DB_* secrets, and this follows the
# same pattern. See vps/03-architecture.md.

services:
    api:
        image: ${DOCKERHUB_USERNAME}/dynamic-alarm-api:latest
        # The reverse proxy resolves this name on the shared network, so it is
        # part of the nginx configuration rather than a label.
        container_name: dynamic-alarm-api
        restart: unless-stopped
        # Node is PID 1 without this, and PID 1 gets no default signal handling,
        # so a `SIGTERM` the process does not explicitly listen for is discarded.
        # The API does install a handler, and this makes sure it is reached even
        # if that ever regresses. It also reaps the zombies `job-exec` leaves.
        init: true
        # Longer than the API's own 20s drain, so the clean shutdown finishes
        # before Docker resorts to SIGKILL. Killing mid-pass leaves a claimed
        # occurrence unclaimable for the five minutes its lease has left.
        stop_grace_period: 30s
        # expose, never ports: the proxy owns ingress. Publishing 3000 on the
        # host would put the API on the internet beside its own HTTPS front door.
        expose:
            - '3000'
        networks:
            - web
        env_file:
            - .env
        # The monitor loop, declared here rather than as host cron: the VPS runs
        # an Ofelia container that reads these labels over the Docker socket, so
        # the schedule deploys with the app instead of being configured by hand
        # on the server. See vps_hosting/03-architecture.md.
        #
        # `job-exec` runs inside the container that is already up, which is the
        # point: the tick reuses the live database pool rather than reconnecting
        # to an external MySQL every minute. The command carries no secret; the
        # script reads MONITOR_TOKEN from the container's own environment.
        labels:
            ofelia.enabled: 'true'
            ofelia.job-exec.monitor-tick.schedule: '@every 1m'
            ofelia.job-exec.monitor-tick.command: 'node dist/tools/monitorTick.js'
        healthcheck:
            # 127.0.0.1 rather than localhost. BusyBox wget tries ::1 first, and
            # a Node process bound to 0.0.0.0 is IPv4 only, so it refuses the
            # connection and the container reports unhealthy while serving
            # traffic perfectly.
            test:
                [
                    'CMD',
                    'wget',
                    '--no-verbose',
                    '--tries=1',
                    '--spider',
                    'http://127.0.0.1:3000/api/v1/health',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            # The API connects to MySQL before it listens, and that connection
            # crosses the internet to an external host.
            start_period: 30s

networks:
    web:
        external: true
